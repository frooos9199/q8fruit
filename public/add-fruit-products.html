        function addProducts(products, categoryName) {
            try {
                let existingProducts = [];
                const stored = localStorage.getItem('products');
                if (stored) {
                    existingProducts = JSON.parse(stored);
                }

                const newProducts = products.map((product, index) => ({
                    ...product,
                    id: existingProducts.length + index + 1
                }));

                const allProducts = [...existingProducts, ...newProducts];
                localStorage.setItem('products', JSON.stringify(allProducts));
                
                document.getElementById('result').innerHTML = 
                    `<div class="success">✅ تم إضافة ${newProducts.length} منتج ${categoryName} بنجاح!</div>`;
                
                showProducts();
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    `<div style="color: red;">❌ خطأ: ${error.message}</div>`;
            }
        }

        function addFruitProducts() {
            addProducts(fruitProducts, 'فواكه');
        }

        function addVegetableProducts() {
            addProducts(vegetableProducts, 'خضار');
        }

        function addLeafyProducts() {
            addProducts(leafyProducts, 'ورقيات');
        }

        function addAllProducts() {
            const allProducts = [...fruitProducts, ...vegetableProducts, ...leafyProducts];
            addProducts(allProducts, 'جميع الفئات');
        }

        function clearProducts() {
            if (confirm('هل أنت متأكد من حذف جميع المنتجات؟')) {
                localStorage.removeItem('products');
                document.getElementById('result').innerHTML = 
                    '<div class="success">🗑️ تم حذف جميع المنتجات</div>';
                document.getElementById('products-list').innerHTML = '';
            }
        }

        function showProducts() {
            const stored = localStorage.getItem('products');
            if (!stored) {
                document.getElementById('products-list').innerHTML = '<p>لا توجد منتجات محفوظة</p>';
                return;
            }

            const products = JSON.parse(stored);
            let html = `<h3>المنتجات المحفوظة (${products.length}):</h3>`;
            
            // تجميع حسب الفئة
            const groupedByCategory = products.reduce((acc, product) => {
                if (!acc[product.category]) acc[product.category] = [];
                acc[product.category].push(product);
                return acc;
            }, {});

            Object.keys(groupedByCategory).forEach(category => {
                html += `<h4>${category} (${groupedByCategory[category].length}):</h4>`;
                groupedByCategory[category].forEach(product => {
                    const imageUrl = product.images && product.images[0] ? product.images[0] : 
                                   (product.image || 'https://via.placeholder.com/60x60?text=صورة');
                    
                    html += `
                        <div class="product">
                            <img src="${imageUrl}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/60x60?text=صورة'">
                            <strong>${product.name}</strong> - ${product.category}
                            <br>الأسعار: ${product.units.map(u => `${u.name}: ${u.price} د.ك`).join(', ')}
                            <br>الكمية: ${product.quantity} | الحالة: ${product.active ? 'مفعل' : 'موقوف'}
                        </div>
                    `;
                });
            });
            
            document.getElementById('products-list').innerHTML = html;
        }

        // عرض المنتجات عند تحميل الصفحة
        window.onload = function() {
            showProducts();
