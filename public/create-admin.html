<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب الأدمن</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: right;
        }
        .info strong {
            color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 إنشاء حساب الأدمن</h1>
        
        <div class="info">
            <p><strong>البريد الإلكتروني:</strong> summit_kw@hotmail.com</p>
            <p><strong>كلمة المرور:</strong> 9199</p>
            <p><strong>الاسم:</strong> مدير النظام</p>
            <p><strong>الهاتف:</strong> 98899426</p>
            <p><strong>الصلاحية:</strong> أدمن</p>
        </div>

        <button onclick="createAdmin()">إنشاء حساب الأدمن</button>
        <button onclick="window.location.href='/'">العودة للموقع</button>
        
        <div id="result"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBW2-EDd8K8Nq5Uj5fJFaeAzQnchjcdbJU",
            authDomain: "fruitq8-ba5ef.firebaseapp.com",
            projectId: "fruitq8-ba5ef",
            storageBucket: "fruitq8-ba5ef.firebasestorage.app",
            messagingSenderId: "496410641214",
            appId: "1:496410641214:web:bc829a07ac23b9ba0ae26f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.createAdmin = async function() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>جاري إنشاء الحساب...</p>';

            try {
                const adminData = {
                    name: "مدير النظام",
                    email: "summit_kw@hotmail.com",
                    password: "9199",
                    phone: "98899426"
                };

                // إنشاء المستخدم في Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(
                    auth,
                    adminData.email,
                    adminData.password
                );

                // تحديث الملف الشخصي
                await updateProfile(userCredential.user, {
                    displayName: adminData.name
                });

                // حفظ بيانات إضافية في Firestore
                const userProfile = {
                    uid: userCredential.user.uid,
                    name: adminData.name,
                    email: adminData.email,
                    phone: adminData.phone,
                    role: 'admin',
                    active: true,
                    createdAt: new Date(),
                    updatedAt: new Date()
                };

                await setDoc(doc(db, 'users', userCredential.user.uid), userProfile);

                resultDiv.innerHTML = '<div class="result success">✅ تم إنشاء حساب الأدمن بنجاح!</div>';
            } catch (error) {
                let errorMessage = 'حدث خطأ غير متوقع';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'البريد الإلكتروني مستخدم بالفعل - الحساب موجود';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'البريد الإلكتروني غير صحيح';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'كلمة المرور ضعيفة';
                }

                resultDiv.innerHTML = `<div class="result error">❌ ${errorMessage}</div>`;
                console.error('خطأ:', error);
            }
        };
    </script>
</body>
</html>
